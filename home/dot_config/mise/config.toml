# Default runtimes. Project selectors override these without changing them.
[tools]
node = "24.21.0"
python = "3.13.16"
rust = { version = "1.97.1", profile = "minimal", components = ["rustfmt", "clippy"] }
# Follow Bun 1.x globally; project-specific exact selectors still win.
bun = { version = "1", auto_update = "6h" }

# Global CLI updates are explicit opt-ins. Project pins and lockfiles still win.
chezmoi = { version = "latest", auto_update = "6h" }
gh = { version = "latest", auto_update = "6h" }
git-lfs = { version = "latest", auto_update = "6h" }
gitleaks = { version = "latest", auto_update = "6h" }
shellcheck = { version = "latest", auto_update = "6h" }
uv = { version = "latest", auto_update = "6h" }
ripgrep = { version = "latest", auto_update = "6h" }
fd = { version = "latest", auto_update = "6h" }
fzf = { version = "latest", auto_update = "6h" }
zoxide = { version = "latest", auto_update = "6h" }
bat = { version = "latest", auto_update = "6h" }

# Additional standalone tools; keep native dependency stacks in Homebrew.
# Preserve upstream actionlint rather than the shorthand's suggested fork.
"aqua:rhysd/actionlint" = { version = "latest", auto_update = "6h" }
lefthook = { version = "latest", auto_update = "6h" }
cargo-deny = { version = "latest", auto_update = "6h" }
shfmt = { version = "latest", auto_update = "6h" }
swiftformat = { version = "latest", auto_update = "6h", os = ["macos"] }
swiftlint = { version = "latest", auto_update = "6h", os = ["macos"] }
# The Cargo backend supports current releases; preserve serialization support.
"cargo:tokei" = { version = "latest", auto_update = "6h", features = "all" }
codex = { version = "latest", auto_update = "6h" }
pandoc = { version = "latest", auto_update = "6h" }
# Use the publisher's standalone Mac executable rather than a Python wrapper.
yt-dlp = { version = "latest", auto_update = "6h", os = ["macos"], asset_pattern = "yt-dlp_macos" }
mole = { version = "latest", auto_update = "6h", os = ["macos"] }

vercel = { version = "latest", auto_update = "6h" }
turbo = { version = "2", auto_update = "6h" }
"npm:neon" = { version = "8", auto_update = "6h" }
# The npm package also includes the version-matched skills and native executable.
"npm:agent-browser" = { version = "latest", auto_update = "6h" }
"github:coreycoto/git-slop" = { version = "0.16", auto_update = "6h", filter_bins = ["git-slop"] }
"github:coreycoto/gh-steward" = { version = "0.6", auto_update = "6h", bin = "gh-steward" }

[settings]
# Resolving a command must never install missing software implicitly.
auto_install = false
exec_auto_install = false
not_found_auto_install = false
# An explicit missing project version must fail instead of using another version.
not_found_system_fallback = false
# Keep replaced versions available for deliberate rollback and later cleanup.
upgrade.auto_prune = false
minimum_release_age = "12h"
# Mise isolates each npm CLI; Bun is the installer, not a global tool owner.
npm.package_manager = "bun"

[env]
# Keep mise's Rustup state separate from existing ~/.rustup and ~/.cargo state.
MISE_RUSTUP_HOME = "{{env.HOME}}/.local/share/dotfiles/rustup"
MISE_CARGO_HOME = "{{env.HOME}}/.local/share/dotfiles/cargo"
